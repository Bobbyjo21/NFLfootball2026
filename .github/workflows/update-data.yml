name: Update NFL data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"

permissions:
  contents: write

concurrency:
  group: nfl-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download current NFL statistics
        env:
          NFL_SEASON: ${{ vars.NFL_SEASON }}
        run: node update-stats.mjs

      - name: Test simulator
        run: node test-normalize.mjs && node test-browser.mjs

      - name: Commit updated data
        run: |
          git config user.name "NFL Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-data.json
          git diff --cached --quiet || git commit -m "Update NFL data"
          git push
